<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MindPlay Onboarding</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app-container">

    <section id="login-section" class="login-container">

      <div class="logo">
        MindPlay
      </div>

      <h1>ברוכים הבאים</h1>

      <p class="subtitle">
        מערכת האונבורדינג למדריכים חדשים
      </p>

      <button id="google-login-btn">
        התחברות עם Google
      </button>

      <p id="user-message"></p>

    </section>


    <section id="dashboard-section" class="dashboard hidden">

      <header class="dashboard-header">

        <div>
          <h1>האונבורדינג שלי</h1>
          <p id="welcome-message"></p>
        </div>

        <div class="user-box">

          <img
            id="user-photo"
            class="user-photo"
            alt="תמונת משתמש"
          >

          <div>
            <strong id="user-name"></strong>
            <p id="user-email"></p>
            <p>
              תפקיד:
              <span id="user-role"></span>
            </p>
          </div>

          <button id="logout-btn" class="secondary-button">
            התנתקות
          </button>

        </div>

      </header>


      <section class="topics-section">

        <h2>מסלול ההכשרה</h2>

        <div id="topics-container">
          <p>טוען נושאים...</p>
        </div>

      </section>

    </section>

  </main>

  <script type="module" src="app.js"></script>

</body>

</html>
